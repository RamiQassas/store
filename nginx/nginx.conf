upstream django_app {
    server web:8000;
}

# HTTP Server - Port 80 (Redirect to HTTPS & ACME challenge)
server {
    listen 80;
    server_name raqamiyatapp.com www.raqamiyatapp.com *.raqamiyatapp.com 2.29.26.113 _;

    # مسار التوثيق لـ Certbot (Let's Encrypt SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # التوجيه التلقائي إلى HTTPS لدومين raqamiyatapp.com
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Port 443 (SSL Enabled)
server {
    listen 443 ssl;
    server_name raqamiyatapp.com www.raqamiyatapp.com *.raqamiyatapp.com;

    ssl_certificate /etc/letsencrypt/live/raqamiyatapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raqamiyatapp.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # الملفات الثابتة
    location /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # الملفات المرفوعة (Media)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # التوجيه العام مع دعم WebSockets الكامل لـ Daphne Channels
    location / {
        proxy_pass http://django_app;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;
        client_max_body_size 50M;
    }
}
