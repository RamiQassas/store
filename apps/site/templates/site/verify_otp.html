{% extends "site/base.html" %}
{% block title %}التحقق من الرمز | Raqamiyat{% endblock %}
{% block content %}
<section class="auth-shell">
  <article class="panel p-10 auth-panel text-center">
    <div class="mb-8">
        <div class="w-20 h-20 bg-cyan/10 rounded-full flex items-center justify-center text-3xl text-cyan mx-auto mb-6">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="text-2xl font-black mb-2">أدخل رمز التحقق</h1>
        <p class="text-slate-500">لقد أرسلنا رمزاً مكوناً من 6 أرقام إلى بريدك الإلكتروني:<br><strong class="text-slate-300">{{ user.email }}</strong></p>
    </div>
    
    <form method="post" class="stack gap-6">
      {% csrf_token %}
      <div class="field-group">
        <input type="text" name="code" maxlength="6" class="text-center text-3xl font-black tracking-[15px] py-4 bg-slate-900 border-white/10 rounded-2xl focus:border-cyan transition-all" placeholder="000000" required autofocus>
      </div>
      
      <button class="btn btn-primary w-full py-4 text-lg font-bold" type="submit">تأكيد الرمز</button>
    </form>

    <div class="mt-8 pt-6 border-t border-white/5">
        <p class="text-xs text-slate-500 mb-4">لم يصلك الرمز؟</p>
        <form method="post" id="resend-form">
            {% csrf_token %}
            <input type="hidden" name="action" value="resend">
            <button type="submit" class="text-cyan text-xs font-bold hover:underline">إعادة إرسال الرمز</button>
        </form>
    </div>
    
    <div class="mt-4">
        <a href="{% url 'v3_login' %}" class="text-slate-500 text-[10px] hover:text-white transition-colors">العودة لتسجيل الدخول</a>
    </div>
  </article>
</section>

<style>
    .auth-panel { max-width: 450px; margin: 0 auto; border: 1px solid rgba(255,255,255,0.05); }
    input[name="code"]::placeholder { color: rgba(255,255,255,0.05); letter-spacing: 15px; }
</style>
{% endblock %}
