{% extends "site/base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-xl p-8 text-center shadow-2xl">
        <div class="mb-6">
            <div class="w-20 h-20 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-clock text-4xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">رابط التفعيل منتهي</h1>
            <p class="text-slate-400">عذراً، يبدو أن رابط التفعيل الذي استخدمته قد انتهت صلاحيته (تصلح الروابط لمدة 24 ساعة فقط).</p>
        </div>

        <div class="space-y-4">
            <form action="{% url 'resend_verification' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                    إرسال رابط تفعيل جديد
                </button>
            </form>
            
            <a href="{% url 'home' %}" class="block text-sm text-slate-500 hover:text-slate-300">
                العودة للرئيسية
            </a>
        </div>
        
        <div class="mt-8 pt-6 border-t border-slate-800">
            <p class="text-xs text-slate-500 italic">إذا استمرت المشكلة، يرجى التواصل مع فريق الدعم الفني.</p>
        </div>
    </div>
</div>
{% endblock %}
