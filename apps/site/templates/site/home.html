{% extends "site/base.html" %}
{% load static site_tags %}

{% block title %}الرئيسية | Raqamiyat - منصة الخدمات الرقمية الحديثة{% endblock %}

{% block extra_head %}
<style>
    /* 
       RAQAMIYAT V6 - Minimalist Fintech Redesign
       Aimed at absolute clarity, small icons, and perfect mobile scaling.
    */

    :root {
        --accent: #06b6d4;
        --bg: #050811;
        --glass: rgba(15, 23, 42, 0.6);
        --border: rgba(255, 255, 255, 0.06);
        --text-dim: #94a3b8;
    }

    /* --- Page Reveal --- */
    .reveal { opacity: 0; transform: translateY(15px); transition: all 0.7s cubic-bezier(0.2, 1, 0.3, 1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* --- Hero Section: Clean & Focused --- */
    .hero-v6 {
        padding: clamp(5rem, 12vh, 10rem) 0;
        text-align: center;
        background: radial-gradient(circle at top, rgba(6, 182, 212, 0.08) 0%, transparent 70%);
    }

    .hero-v6 h1 {
        font-size: clamp(1.65rem, 7vw, 4rem);
        font-weight: 900;
        color: #fff;
        line-height: 1.2;
        margin-bottom: 1.25rem;
        letter-spacing: -0.02em;
    }

    .hero-v6 p {
        font-size: clamp(0.875rem, 2vw, 1.1rem);
        color: var(--text-dim);
        max-width: 580px;
        margin: 0 auto 2.5rem;
        line-height: 1.6;
    }

    .cta-v6 {
        display: flex;
        gap: 1rem;
        justify-content: center;
    }

    @media (max-width: 640px) {
        .cta-v6 { flex-direction: column; width: 100%; max-width: 280px; margin: 0 auto; }
        .cta-v6 .btn { width: 100%; padding: 1rem; border-radius: 12px; font-size: 0.9rem; }
    }

    /* --- Tiny Modern Icons --- */
    .icon-v6 {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        font-size: 1.25rem;
        margin-bottom: 1.25rem;
    }
    
    .icon-box-small {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: rgba(6, 182, 212, 0.1);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        margin-bottom: 1rem;
    }

    /* --- Features: Minimalist Grid --- */
    .grid-v6 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 2.5rem;
        padding: 4rem 0;
    }

    .card-v6 {
        background: transparent;
        transition: transform 0.3s;
    }
    .card-v6 h3 { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 0.75rem; }
    .card-v6 p { font-size: 0.875rem; color: var(--text-dim); line-height: 1.6; }

    /* --- How It Works: Simplified --- */
    .steps-v6 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 2rem;
        margin-top: 3rem;
    }

    .step-v6 { text-align: center; }
    .step-v6 .num { font-size: 0.75rem; font-weight: 900; color: var(--accent); opacity: 0.5; margin-bottom: 0.5rem; display: block; }
    .step-v6 h4 { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
    .step-v6 p { font-size: 0.8rem; color: var(--text-dim); }

    /* --- Featured Products: Compact & Elegant --- */
    .products-head-v6 { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5rem; }
    .products-head-v6 h2 { font-size: 1.75rem; font-weight: 900; }
    
    .p-grid-v6 {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.5rem;
    }

    .p-card-v6 {
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
    }

    .p-card-v6:hover { border-color: rgba(6, 182, 212, 0.3); transform: translateY(-4px); }

    .p-img-v6 {
        width: 100%;
        aspect-ratio: 1/1;
        background: #0a0f1c;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
    }
    .p-img-v6 img { width: 100%; height: 100%; object-fit: contain; }

    .p-body-v6 { padding: 1.25rem; flex-grow: 1; display: flex; flex-direction: column; gap: 0.5rem; }
    .p-body-v6 .cat { font-size: 8px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
    .p-body-v6 .title { font-size: 0.9rem; font-weight: 700; color: #fff; line-height: 1.4; height: 2.8em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    
    .p-footer-v6 { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center; }
    .p-footer-v6 .price { font-size: 1.1rem; font-weight: 800; color: #fff; }

    @media (max-width: 640px) {
        .p-grid-v6 { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        .p-body-v6 { padding: 0.75rem; }
        .p-body-v6 .title { font-size: 0.8rem; }
        .p-footer-v6 { padding-top: 0.75rem; }
        .p-footer-v6 .price { font-size: 0.95rem; }
        .p-footer-v6 .btn { display: none; }
    }

    /* Badges */
    .sale-badge { 
        position: absolute; top: 0.75rem; right: 0.75rem; z-index: 10;
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: #000; font-size: 7px; font-weight: 900; padding: 4px 10px; border-radius: 8px;
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
        animation: pulse-gold 2s infinite;
        border: 1px solid rgba(255,255,255,0.2);
    }
    @keyframes pulse-gold {
        0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); transform: scale(1); }
        70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); transform: scale(1.05); }
        100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); transform: scale(1); }
    }
    .out-of-stock-overlay {
        position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: grayscale(1);
        display: flex; align-items: center; justify-content: center; z-index: 5;
    }
    .out-of-stock-label {
        background: #f43f5e; color: #fff; font-size: 7px; font-weight: 900; 
        padding: 3px 10px; border-radius: 5px; transform: rotate(-5deg);
    }

    /* --- Social & Support: Refined --- */
    .social-v6 {
        margin: 6rem 0;
        padding: 4rem 2rem;
        text-align: center;
    }

    .social-v6 h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; }
    
    .support-card-v6 {
        max-width: 450px;
        margin: 0 auto 4rem;
        padding: 2.5rem;
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.08) 0%, rgba(5, 8, 17, 0) 100%);
        border: 1px solid rgba(6, 182, 212, 0.15);
        border-radius: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
    }
    .support-card-v6:hover { border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 25px 50px -12px rgba(6, 182, 212, 0.2); }
    
    .social-links-v6 { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; }
    .social-icon-v6 {
        width: 54px;
        height: 54px;
        border-radius: 18px;
        background: #0a0f1c;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        font-size: 1.5rem;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .social-icon-v6:hover { 
        border-color: var(--accent); 
        color: #fff; 
        transform: scale(1.2) rotate(8deg); 
        background: rgba(6, 182, 212, 0.1);
        box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.4);
    }
    .social-icon-v6 i, .social-icon-v6 img { width: 24px; height: 24px; object-fit: contain; }

    /* --- Modern Payment Methods Grid --- */
    .payments-v6 { padding: 5rem 0; border-top: 1px solid var(--border); }
    .payments-v6-grid { 
        display: flex; 
        flex-wrap: wrap; 
        justify-content: center; 
        gap: 1.5rem; 
        margin-top: 2rem;
    }
    .payment-icon-v6 {
        width: 80px;
        height: 48px;
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        filter: grayscale(1) opacity(0.5);
    }
    .payment-icon-v6:hover {
        filter: grayscale(0) opacity(1);
        border-color: var(--accent);
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 8px 15px -5px rgba(6, 182, 212, 0.3);
    }

    /* --- Social & Support: Refined --- */
    .social-v6 {
        margin: 4rem 0;
        padding: 2rem;
        text-align: center;
    }

    .social-v6 h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.75rem; }
    
    .support-card-v6 {
        max-width: 400px;
        margin: 0 auto 3rem;
        padding: 2rem;
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.08) 0%, rgba(5, 8, 17, 0) 100%);
        border: 1px solid rgba(6, 182, 212, 0.15);
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
    }
    .support-card-v6:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(6, 182, 212, 0.2); }
    
    .social-links-v6 { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
    .social-icon-v6 {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #0a0f1c;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        font-size: 1.25rem;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .social-icon-v6:hover { 
        border-color: var(--accent); 
        color: #fff; 
        transform: scale(1.1) rotate(5deg); 
        background: rgba(6, 182, 212, 0.1);
        box-shadow: 0 8px 15px -5px rgba(6, 182, 212, 0.3);
    }
    .social-icon-v6 i, .social-icon-v6 img { width: 20px; height: 20px; object-fit: contain; }
