{% extends "site/control_base.html" %}

{% block control_content %}
<div class="page-head">
    <span class="eyebrow">إدارة الدعم الفني</span>
    <h1>فتح تذكرة جديدة لمستخدم</h1>
</div>

<div class="max-w-2xl">
    <div class="management-card">
        <div class="management-header">
            <h3 class="font-bold flex items-center gap-2">
                <i class="fas fa-comment-medical text-cyan"></i> تفاصيل التذكرة
            </h3>
        </div>
        <div class="p-8">
            <form method="post" class="stack gap-6">
                {% csrf_token %}
                
                <div class="relative">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">بريد/اسم/هاتف المستخدم المستهدف</label>
                    <input type="text" name="user_identifier" id="id_user_identifier" class="builder-input" placeholder="ابحث بالبريد أو الاسم أو الهاتف..." required autocomplete="off">
                    <div id="user-results" class="absolute z-50 w-full mt-1 bg-slate-900 border border-white/10 rounded-xl shadow-2xl hidden overflow-hidden"></div>
                    <p class="mt-1 text-[10px] text-slate-500 italic">يجب أن يكون للمستخدم حساب مسجل في الموقع.</p>
                </div>

                <script>
                    const identifierInput = document.querySelector('input[name="user_identifier"]');
                    const resultsDiv = document.getElementById('user-results');
                    let debounceTimer;

                    identifierInput.addEventListener('input', function() {
                        clearTimeout(debounceTimer);
                        const query = this.value.trim();
                        if (query.length < 2) {
                            resultsDiv.classList.add('hidden');
                            return;
                        }

                        debounceTimer = setTimeout(() => {
                            fetch(`/api/users/search/?q=${encodeURIComponent(query)}`)
                                .then(res => res.json())
                                .then(data => {
                                    if (data.length > 0) {
                                        resultsDiv.innerHTML = data.map(u => `
                                            <div class="p-3 hover:bg-cyan/10 cursor-pointer border-b border-white/5 last:border-0" onclick="selectUser('${u.email}')">
                                                <div class="font-bold text-sm text-white">${u.email}</div>
                                                <div class="text-[10px] text-slate-500">${u.full_name || u.username} - ${u.phone || ''}</div>
                                            </div>
                                        `).join('');
                                        resultsDiv.classList.remove('hidden');
                                    } else {
                                        resultsDiv.classList.add('hidden');
                                    }
                                });
                        }, 300);
                    });

                    function selectUser(email) {
                        identifierInput.value = email;
                        resultsDiv.classList.add('hidden');
                    }

                    document.addEventListener('click', (e) => {
                        if (!identifierInput.contains(e.target) && !resultsDiv.contains(e.target)) {
                            resultsDiv.classList.add('hidden');
                        }
                    });
                </script>

                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">موضوع التذكرة</label>
                    {{ form.subject }}
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">الرسالة الأولى</label>
                    {{ form.message }}
                    <p class="mt-1 text-[10px] text-slate-500 italic">سيصل إشعار فوري للمستخدم بهذه الرسالة.</p>
                </div>

                <div class="pt-4">
                    <button type="submit" class="btn btn-primary w-full py-4">
                        <i class="fas fa-paper-plane mr-2"></i> فتح المحادثة وإرسال الرسالة
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .builder-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 0.75rem 1rem;
        color: #fff;
        font-size: 0.875rem;
    }
</style>
{% endblock %}
