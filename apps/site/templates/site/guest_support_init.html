{% extends "site/base.html" %}
{% block title %}بدء الدعم الفني | Raqamiyat{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-20 px-6">
    <div class="panel p-10 stack gap-8">
        <div class="text-center">
            <div class="w-20 h-20 bg-cyan/10 rounded-[2rem] flex items-center justify-center text-cyan mx-auto mb-6">
                <i class="fas fa-user-tag text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black mb-2">مرحباً بك في الدعم المباشر</h1>
            <p class="text-slate-400 text-sm">يرجى تزويدنا ببياناتك لنتمكن من مساعدتك بشكل أفضل.</p>
        </div>

        <form method="post" action="{% url 'create_chat' %}" class="stack gap-6">
            {% csrf_token %}
            <input type="hidden" name="subject" value="{{ subject }}">
            
            <div class="field-group">
                <label class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-2 block">الاسم الكامل <span class="text-danger">*</span></label>
                <input type="text" name="guest_name" required class="builder-input w-full py-4 px-6 rounded-2xl bg-white/[0.03] border-white/5 focus:border-cyan transition" placeholder="أدخل اسمك الكريم...">
            </div>

            <div class="field-group">
                <label class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-2 block">رقم الهاتف (اختياري)</label>
                <input type="tel" name="guest_phone" class="builder-input w-full py-4 px-6 rounded-2xl bg-white/[0.03] border-white/5 focus:border-cyan transition" placeholder="مثال: 0912345678">
            </div>

            <button type="submit" class="btn btn-primary w-full py-5 rounded-2xl font-black text-lg shadow-lg shadow-cyan/20">
                بدء المحادثة الآن
            </button>
        </form>

        <p class="text-center text-[10px] text-slate-600 font-bold uppercase tracking-tighter">
            فريقنا متاح للرد عليك في أسرع وقت ممكن
        </p>
    </div>
</div>
{% endblock %}
