{% extends "site/base.html" %}
{% block title %}تغيير البريد الإلكتروني | Raqamiyat{% endblock %}
{% block content %}
<section class="auth-shell">
  <article class="panel p-10 auth-panel text-center">
    <div class="mb-8">
        <div class="w-20 h-20 bg-cyan/10 rounded-full flex items-center justify-center text-3xl text-cyan mx-auto mb-6">
            <i class="fas fa-envelope-open-text"></i>
        </div>
        <h1 class="text-2xl font-black mb-2">تغيير البريد الإلكتروني</h1>
        <p class="text-slate-500 text-sm">سيتم إرسال رمز تحقق إلى بريدك الحالي لتأكيد العملية.</p>
    </div>

    <form method="post" class="stack gap-6 text-right">
        {% csrf_token %}
        <div class="field-group">
            <label class="text-xs text-slate-500 mb-2 block">البريد الإلكتروني الجديد:</label>
            <input type="email" name="new_email" class="builder-input" placeholder="example@domain.com" required>
        </div>
        <button type="submit" class="btn btn-primary w-full py-4 text-sm font-bold">إرسال رمز التأكيد</button>
    </form>
    
    <div class="mt-8 pt-6 border-t border-white/5">
        <a href="{% url 'dashboard' %}" class="text-slate-500 text-xs hover:text-cyan transition-colors">إلغاء والعودة</a>
    </div>
  </article>
</section>

<style>
    .auth-panel { max-width: 450px; margin: 0 auto; border: 1px solid rgba(255,255,255,0.05); }
    .builder-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; color: #fff; padding: 12px; width: 100%; transition: all 0.2s; text-align: left; }
    .builder-input:focus { border-color: var(--cyan); outline: none; background: rgba(255,255,255,0.05); }
</style>
{% endblock %}
