{% extends "site/base.html" %}
{% block title %}التحقق الثنائي | Raqamiyat{% endblock %}
{% block content %}
<section class="auth-shell">
  <article class="panel p-10 auth-panel text-center">
    <div class="mb-8 text-center">
        <div class="w-20 h-20 bg-cyan/10 rounded-full flex items-center justify-center text-3xl text-cyan mx-auto mb-6">
            <i class="fas fa-user-shield"></i>
        </div>
        <h1 class="text-2xl font-black mb-2">التحقق من الهوية</h1>
        <p class="text-slate-500 text-sm">أدخل الرمز من تطبيق المصادقة (Google Authenticator)</p>
    </div>

    <form method="post" class="stack gap-6">
        {% csrf_token %}
        <div class="field-group">
            <input type="text" name="code" class="builder-input text-center tracking-[1em] font-black text-2xl" placeholder="000000" maxlength="6" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary w-full py-4 text-sm font-bold">تحقق ودخول</button>
    </form>

    <div class="mt-10 pt-6 border-t border-white/5">
        <p class="text-[10px] text-slate-500 mb-4">لا تستطيع الوصول للتطبيق؟</p>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="use_email">
            <button type="submit" class="text-cyan text-xs font-bold hover:underline">
                التحقق عبر البريد الإلكتروني بدلاً من ذلك
            </button>
        </form>
    </div>
  </article>
</section>

<style>
    .auth-panel { max-width: 400px; margin: 0 auto; border: 1px solid rgba(255,255,255,0.05); }
    .builder-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; color: #fff; padding: 16px; width: 100%; transition: all 0.2s; }
    .builder-input:focus { border-color: var(--cyan); outline: none; background: rgba(255,255,255,0.05); }
</style>
{% endblock %}
