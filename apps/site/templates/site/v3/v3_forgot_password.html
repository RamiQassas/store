{% extends "site/base.html" %}
{% block title %}إعادة تعيين كلمة المرور | Raqamiyat{% endblock %}
{% block content %}
<section class="auth-shell">
  <article class="panel p-10 auth-panel">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-black mb-2">نسيت كلمة المرور؟</h1>
        <p class="text-slate-500 text-sm">أدخل بريدك الإلكتروني وسنرسل لك رابطاً لتعيين كلمة مرور جديدة.</p>
    </div>
    
    <form method="post" class="stack gap-6">
      {% csrf_token %}
      <div class="field-group">
        <label>البريد الإلكتروني</label>
        <input type="email" name="email" class="auth-input" placeholder="name@example.com" required autofocus>
      </div>
      
      <button class="btn btn-primary w-full py-4 text-lg font-bold" type="submit">إرسال رمز التحقق (OTP)</button>
    </form>

    <div class="text-center mt-8 pt-6 border-t border-white/5">
      <p class="text-slate-400 text-sm">تذكرت كلمة المرور؟ <a href="{% url 'site_login' %}" class="text-cyan font-bold">تسجيل الدخول</a></p>
    </div>
  </article>
</section>

<style>
    .auth-input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #fff; transition: all 0.2s; }
    .auth-input:focus { border-color: var(--cyan); outline: none; background: rgba(255,255,255,0.05); }
</style>
{% endblock %}
