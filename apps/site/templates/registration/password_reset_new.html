{% extends "site/base.html" %}
{% block title %}تعيين كلمة مرور جديدة | Raqamiyat{% endblock %}
{% block content %}
<section class="auth-shell">
  <article class="panel p-10 auth-panel">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-black mb-2">كلمة مرور جديدة</h1>
        <p class="text-slate-500 text-sm">أهلاً بك مجدداً <strong class="text-slate-300">{{ user_email }}</strong>. يرجى تعيين كلمة مرور قوية لحسابك.</p>
    </div>
    
    <form method="post" class="stack gap-6" action="{% url 'v3_reset_password' %}">
      {% csrf_token %}
      
      <div class="field-group">
        <label>كلمة المرور الجديدة</label>
        <input type="password" name="password" class="auth-input" placeholder="********" required minlength="10">
        <small class="text-slate-500 mt-1 block">يجب أن تكون 10 خانات على الأقل.</small>
      </div>

      <div class="field-group">
        <label>تأكيد كلمة المرور</label>
        <input type="password" name="confirm_password" class="auth-input" placeholder="********" required>
      </div>
      
      <button class="btn btn-primary w-full py-4 text-lg font-bold" type="submit">حفظ كلمة المرور والدخول</button>
    </form>
  </article>
</section>

<style>
    .auth-input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #fff; transition: all 0.2s; }
    .auth-input:focus { border-color: var(--cyan); outline: none; background: rgba(255,255,255,0.05); }
</style>
{% endblock %}
