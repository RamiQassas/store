<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="mtnYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd00"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <linearGradient id="mtnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005d8f"/>
      <stop offset="100%" stop-color="#003b5c"/>
    </linearGradient>
  </defs>
  <!-- Rounded Yellow Square Base -->
  <rect width="128" height="128" rx="26" fill="url(#mtnYellow)"/>
  <!-- Official MTN Blue Oval -->
  <ellipse cx="64" cy="48" rx="48" ry="23" fill="url(#mtnBlue)"/>
  <!-- MTN Italic Bold Letters + Red Underscore under T -->
  <text x="64" y="56" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="900" font-style="italic" font-family="Arial Black, Impact, sans-serif" letter-spacing="2">MTN</text>
  <rect x="57" y="59" width="13" height="3.5" rx="1.5" fill="#e31837"/>
  <!-- Cash Mobile Brand Title -->
  <rect x="14" y="84" width="100" height="28" rx="14" fill="#003b5c"/>
  <text x="64" y="103" text-anchor="middle" fill="#ffcc00" font-size="14.5" font-weight="900" font-family="Arial, sans-serif" letter-spacing="0.4">Cash Mobile</text>
</svg>
