{% extends "stores/merchant/base.html" %}

{% block menu_prod %}active{% endblock %}

{% block content %}

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 900;">
            {% if variant.pk %}تعديل الباقة: {{ variant.name }}{% else %}إضافة باقة سعر لـ {{ product.name }}{% endif %}
        </h1>
        <a href="{% url 'merchant_product_edit' product.id %}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> العودة للمنتج</a>
    </div>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            
            <div style="display: grid; grid-template-cols: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label class="form-label">اسم الباقة (مثال: باقة 100 جوهرة):</label>
                    <input type="text" name="name" value="{{ variant.name|default:'' }}" required class="form-input" placeholder="أدخل اسم الباقة">
                </div>
                <div class="form-group">
                    <label class="form-label">رمز الـ SKU:</label>
                    <input type="text" name="sku" value="{{ variant.sku|default:'' }}" required class="form-input" placeholder="أدخل رمز SKU فريد">
                </div>
            </div>

            <div style="display: grid; grid-template-cols: 1fr 1fr 1fr 1fr; gap: 1.2rem; margin-top: 1rem;">
                <div class="form-group">
                    <label class="form-label">السعر الافتراضي (USD):</label>
                    <input type="number" step="0.01" name="price" value="{{ variant.price|default:'0.00' }}" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">سعر الجملة (Dealer):</label>
                    <input type="number" step="0.01" name="wholesale_price" value="{{ variant.wholesale_price|default:'0.00' }}" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">سعر VIP:</label>
                    <input type="number" step="0.01" name="vip_price" value="{{ variant.vip_price|default:'0.00' }}" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">سعر التكلفة الداخلي (Cost):</label>
                    <input type="number" step="0.01" name="cost" value="{{ variant.cost|default:'0.00' }}" required class="form-input">
                </div>
            </div>

            <div style="display: grid; grid-template-cols: 1fr 1fr; gap: 1.5rem; margin-top: 1rem;">
                <div class="form-group">
                    <label class="form-label">طريقة التسليم:</label>
                    <select name="delivery_type" class="form-input">
                        <option value="manual" {% if variant.delivery_type == 'manual' %}selected{% endif %}>تسليم يدوي (بواسطة المبيعات)</option>
                        <option value="keys" {% if variant.delivery_type == 'keys' %}selected{% endif %}>تسليم تلقائي (أكواد رقمية)</option>
                    </select>
                </div>
                
                <div style="display: flex; align-items: center; gap: 2rem; margin-top: 1.5rem;">
                    <div class="form-group" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="is_active" {% if variant.is_active|default:True %}checked{% endif %} id="isActive">
                        <label class="form-label" style="margin-bottom: 0;" for="isActive">الباقة نشطة للطلب</label>
                    </div>
                    <div class="form-group" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="is_recharge_card" {% if variant.is_recharge_card %}checked{% endif %} id="isRecharge">
                        <label class="form-label" style="margin-bottom: 0;" for="isRecharge">بطاقة شحن تلقائي (سيتم سحب كود شحن وتوصيله فوراً)</label>
                    </div>
                </div>
            </div>

            <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> حفظ الباقة</button>
            </div>
        </form>
    </div>

{% endblock %}
