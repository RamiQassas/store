{% extends "stores/frontend/base.html" %}

{% block title %}{{ page.title }} | {{ store.name }}{% endblock %}

{% block content %}
    <div style="max-width: 800px; margin: 2rem auto; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 3rem;">
        <h1 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem; color: var(--primary);">
            {{ page.title }}
        </h1>
        <div style="line-height: 1.8; font-size: 1.05rem; opacity: 0.95;">
            {{ page.content|linebreaks }}
        </div>
    </div>
{% endblock %}
