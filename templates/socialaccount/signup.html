{% extends "site/v3/auth_base.html" %}
{% load i18n %}

{% block title %}{% trans "Signup" %} | Google | رقميات{% endblock %}

{% block auth_content %}
<div class="glass-panel p-8 md:p-10 text-center">
    <div class="w-24 h-24 bg-white/5 border border-white/10 rounded-full flex items-center justify-center mx-auto mb-8 shadow-inner">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" class="w-12 h-12">
    </div>

    <div class="mb-8">
        <h2 class="text-2xl font-black text-white mb-2">إكمال التسجيل</h2>
        <p class="text-slate-400 text-sm leading-relaxed">
            أهلاً بك! لقد نجحت في تسجيل الدخول عبر Google. يرجى تأكيد رغبتك في إنشاء حساب جديد.
        </p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <button type="submit" class="btn-premium w-full py-5 text-lg group">
            <span>تأكيد إنشاء الحساب</span>
            <i class="fas fa-user-plus group-hover:scale-110 transition-transform"></i>
        </button>
        
        <a href="{% url 'site_login' %}" class="btn-secondary w-full py-4 text-slate-400">
            <span>إلغاء</span>
        </a>
    </form>
</div>
{% endblock %}
