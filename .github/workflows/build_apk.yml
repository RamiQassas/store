name: Build Raqamiyat Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Release and Debug APKs
        run: |
          cd android
          gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release_apk
          cp android/app/build/outputs/apk/release/app-release.apk release_apk/Raqamiyat-Release.apk
          cp android/app/build/outputs/apk/release/app-release.apk release_apk/Raqamiyat-v2.1.0.apk
          cp android/app/build/outputs/apk/release/app-release.apk release_apk/Raqamiyat-v2.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release_apk/Raqamiyat-Debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raqamiyat-Android-APKs
          path: release_apk/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0-apk
          name: Raqamiyat Android App v2.1.0 (Professional Production Release)
          body: |
            ### تطبيق رقميات للأندرويد الاحترافي - Raqamiyat Android App (v2.1.0) 📱⚡
            
            - **نسخة الإنتاج الموقعة والمعتمدة رسمياً (Signed Release)**: متوافقة 100% مع أحدث أجهزة سامسونج **Samsung Galaxy S26 Ultra / One UI 9** وأنظمة أندرويد الحديثة (Android 14, 15, 16).
            - **إصلاح كامل لتجاوب صفحة الخدمات (Services Page Responsive Fix)**: ظهور كامل ومتناسق في منتصف الشاشة لكافة قياسات شاشات أندرويد.
            - **محرك الأوفلاين الذكي والتخزين المحلي (Local-First Reading)**: تصفح المنتجات والأسعار والتصنيفات والصور بالكامل بدون إنترنت.
            - **حماية المعاملات والعمليات الحساسة (Server-Authoritative Transactions)**: منع العمليات المالية (شراء، شحن، سحب، تحويل) عند غياب الإنترنت مع حظر العمليات المكررة (Idempotency Key).
            - **كشف الاتصال الحقيقي بالإنترنت (Connectivity Manager)**: تنبيهات فورية ذكية عند انقطاع واستعادة الاتصال.
            - **استوديو التصوير السريع المتطور (Product Studio)**: تصوير ومعالجة دفعات المنتجات مع عزل أبيض `#ffffff`، ختم رقميات، ومعاينة مزدوجة (Original vs Processed).
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
