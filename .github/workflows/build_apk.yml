name: Build Raqamiyat Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release_apk/Raqamiyat-v2.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raqamiyat-Android-APK
          path: release_apk/Raqamiyat-v2.0.0.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0-apk
          name: Raqamiyat Android App v2.0.0
          body: |
            ### تطبيق رقميات للأندرويد - Raqamiyat Android APK (v2.0.0) 📱⚡
            
            - **تحديثات لحظية ومباشرة من الموقع**: أي تعديل تقوم به على الموقع يظهر فورا في التطبيق.
            - **وضع عدم الاتصال (Offline-First)**: تصفح المنتجات المادية والشراء بدون إنترنت.
            - **استوديو التصوير السريع**: تصوير المنتجات من كاميرا الهاتف وعزل الخلفية البيضاء مع ختم رقميات.
            - **دعم الإشعارات الفورية والتكامل الكامل**.
          files: release_apk/Raqamiyat-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
