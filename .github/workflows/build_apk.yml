name: Build Raqamiyat Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Release and Debug APKs
        run: |
          cd android
          gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release_apk
          cp android/app/build/outputs/apk/release/app-release.apk release_apk/Raqamiyat-Release.apk
          cp android/app/build/outputs/apk/release/app-release.apk release_apk/Raqamiyat-v2.2.0.apk
          cp android/app/build/outputs/apk/release/app-release.apk release_apk/Raqamiyat-v2.1.0.apk
          cp android/app/build/outputs/apk/release/app-release.apk release_apk/Raqamiyat-v2.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release_apk/Raqamiyat-Debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raqamiyat-Android-APKs
          path: release_apk/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0-apk
          name: Raqamiyat Android App v2.2.0 (Native Studio, Google Account Picker & Admin Visibility)
          body: |
            ### تطبيق رقميات للأندرويد الاحترافي - Raqamiyat Android App (v2.2.0) 📱⚡
            
            - **تسجيل الدخول الذكي عبر Google مع منتقي حسابات الجهاز (Google Sign-In with Device Account Picker)**: تكامل كامل عبر Chrome Custom Tabs لإظهار نافذة اختيار حسابات Google المسجلة على الهاتف مباشرة بلمسة واحدة.
            - **إصلاح استوديو التصوير السريع ومنع التعليق (Camera Studio Pre-Compression & Zero Stalling)**: ضغط فوري للصور محلياً قبل الرفع وتقليص الحجم من 30MB إلى أقل من 350KB، مع مؤقت إيقاف ومؤشرات حالة حية، وحل مشكلة التعليق ("يضل يحمل ولا يكمل") نهائياً.
            - **اختيار وضبط الكاميرا الأساسية 1x (Primary Physical Lens Selection)**: تمييز الكاميرا الأساسية عن العدسات العريضة، مع زر مخصص لتشغيل كاميرا الهاتف الأساسية بدقة 200MP.
            - **تمييز التطبيق عن المتصفح في لوحة التحكم (Admin Platform Visibility)**: ظهور شارة تفاعلية واضحة (📱 تطبيق رقميات / 🌐 متصفح ويب) أمام كل مستخدم وكل طلب لدى الإدارة.
            - **طابع Native حقيقي (True Native Feel)**: إزالة التحديد العرضي للنصوص، خلفية وإطارات داكنة متطابقة، منع تأثيرات الارتداد العشوائي، واستجابة لمس فورية.
            - **محرك الأوفلاين الذكي والتخزين المحلي (Local-First Reading)**: تصفح المنتجات والأسعار والتصنيفات والصور بالكامل بدون إنترنت.
            - **حماية المعاملات والعمليات الحساسة (Server-Authoritative Transactions)**: منع العمليات المالية الحساسة عند غياب الإنترنت مع حظر العمليات المكررة (Idempotency Key).
          files: release_apk/*.apk

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
