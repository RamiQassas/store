name: Build Raqamiyat Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Raqamiyat-v2.0.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raqamiyat-Android-APK
          path: android/app/build/outputs/apk/debug/Raqamiyat-v2.0.0.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0-apk
          name: Raqamiyat Android App v2.0.0
          body: |
            ### تطبيق رقميات للأندرويد - Raqamiyat Android APK (v2.0.0) 📱⚡
            
            - **تحديثات مباشرة وفورية**: أي تعديل أو منتج جديد يتم على الموقع ينعكس فوراً ولحظياً داخل التطبيق دون الحاجة لتحديث الـ APK.
            - **محرك الأوفلاين الذكي (Offline-First)**: تصفح المنتجات المادية والأسعار والكتالوج بالكامل بدون إنترنت.
            - **استوديو التصوير السريع**: تصوير المنتجات من كاميرا الهاتف مباشرة وعزل الخلفية بيضاء نقية (#ffffff) مع إضافة ختم رقميات الرسمي.
            - **دعم الإشعارات الفورية والتكامل الكامل**.
          files: android/app/build/outputs/apk/debug/Raqamiyat-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
